[project]
name = "docktape-lead-agent"
version = "0.1.0"
description = "Bounded public-evidence research and qualification for sales leads"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.14.0",
    "openai>=1.109.0,<3",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.11.9,<3",
    "python-dotenv>=1.1.1,<2",
    "rapidfuzz>=3.14.1,<4",
    "tldextract>=5.3.0,<6",
]

[project.scripts]
docktape-lead-agent = "docktape_lead_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "respx>=0.22.0,<1",
    "ruff>=0.16.8",
    "uv-build>=0.12.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
